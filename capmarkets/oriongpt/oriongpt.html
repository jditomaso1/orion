<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Orion — Command Center</title>

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-6GY4CQ6ZFH"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-6GY4CQ6ZFH');
    gtag('set', 'app_name', 'orion');
  </script>

  <!-- Favicon -->
  <link rel="icon" type="image/png"
        href="https://raw.githubusercontent.com/jditomaso1/private-credit-marketing/main/img/favicon.png?v=2" />

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/capmarkets/js/guard.js"></script>

  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: #f5f6f8;
    }
    .thin-scrollbar::-webkit-scrollbar { width: 8px; }
    .thin-scrollbar::-webkit-scrollbar-thumb { background: #d4d4d8; border-radius: 8px; }
    .thin-scrollbar { scrollbar-width: thin; scrollbar-color: #d4d4d8 transparent; }

    .typing-cursor::after {
      content: "|";
      animation: blink 0.7s steps(1) infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }
    .orion-waiting { display:inline-flex; align-items:center; gap:9px; color:#64748b; }
    .orion-waiting-dots { display:inline-flex; align-items:center; gap:4px; }
    .orion-waiting-dots i { width:6px; height:6px; border-radius:50%; background:#187ABA; animation:orionPulse 1.1s ease-in-out infinite; }
    .orion-waiting-dots i:nth-child(2) { animation-delay:.16s; }
    .orion-waiting-dots i:nth-child(3) { animation-delay:.32s; }
    @keyframes orionPulse { 0%,60%,100%{transform:translateY(0);opacity:.3} 30%{transform:translateY(-4px);opacity:1} }
    @media (prefers-reduced-motion: reduce) { .orion-waiting-dots i { animation:none; opacity:.7; } }
  </style>
</head>

<body class="flex h-screen overflow-hidden">

<!-- ================= SIDEBAR ================= -->
<div id="sidebar-placeholder" class="w-64 bg-white border-r border-neutral-200"></div>

<script>
async function injectSidebar() {
  const res = await fetch("/capmarkets/sidebar.html");
  document.getElementById("sidebar-placeholder").innerHTML = await res.text();

  // REQUIRED for sidebar clicks
  window.toggleSection = function (id) {
    const section = document.getElementById(id);
    const icon = document.getElementById("icon-" + id);
    if (!section || !icon) return;

    section.classList.toggle("hidden");
    icon.style.transform = section.classList.contains("hidden")
      ? "rotate(0deg)"
      : "rotate(90deg)";

  };
}
injectSidebar();
</script>

<!-- ================= MAIN ================= -->
<main class="flex-1 flex flex-col">

  <!-- Header -->
  <div class="px-6 py-4 border-b bg-white flex justify-between items-center">
    <div>
      <div class="text-sm font-semibold">OrionGPT — Ask the Deal Stack</div>
      <div class="text-xs text-neutral-500">Grounded in your authorized Capital Markets documents</div>
    </div>
    <span class="text-[10px] px-2 py-1 rounded-full bg-emerald-50 text-emerald-700 border border-emerald-200">
      CAPITAL MARKETS RAG
    </span>
  </div>

  <!-- Chat Stream -->
  <div id="chatStream"
       class="flex-1 overflow-auto thin-scrollbar px-6 py-4 space-y-4 bg-[#f5f6f8]"
       aria-live="polite" aria-busy="false">
  </div>

  <!-- Input -->
  <div class="border-t bg-[#f5f6f8] px-6 py-4">
    <div class="flex items-end gap-2 bg-white rounded-2xl px-3 py-2 border border-neutral-200">
      <textarea
        id="chatInput"
        rows="1"
        placeholder="Ask Orion a real question…"
        class="flex-1 bg-transparent outline-none resize-none text-sm max-h-32 py-[6px]"
      ></textarea>
      <button
        id="sendBtn"
        class="px-4 py-2 rounded-xl text-sm bg-neutral-900 text-white hover:bg-black disabled:opacity-40">
        Ask
      </button>
    </div>
  </div>

</main>

<!-- ================= CHAT LOGIC ================= -->
<script>
/* CONFIG */
const ORION_API_BASE = "https://api.private-credit.ai";

/* API */
async function askOrionBackend(question, topK = 5) {
  const res = await fetch(`${ORION_API_BASE}/capmarkets/ask-orion`, {
    method: "POST",
    credentials: "include",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ question, top_k: topK })
  });
  if (res.status === 401 || res.status === 403) {
    location.replace(`/capmarkets/signin/signin.html?next=${encodeURIComponent(location.pathname)}`);
    throw new Error("Capital Markets access required");
  }
  if (!res.ok) {
    let message = `HTTP ${res.status}`;
    try {
      const payload = await res.json();
      message = typeof payload.detail === "string" ? payload.detail : message;
    } catch (_) {}
    throw new Error(message);
  }
  return res.json();
}

/* HELPERS */
const $ = s => document.querySelector(s);
const stream = $("#chatStream");
const input = $("#chatInput");
const sendBtn = $("#sendBtn");

function escapeHtml(text) {
  return String(text || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function md(text) {
  return escapeHtml(text)
    .replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>")
    .replace(/\n/g,"<br/>");
}

function waitingMarkup() {
  return '<span class="orion-waiting" role="status"><span>Orion is reviewing the deal stack</span><span class="orion-waiting-dots" aria-hidden="true"><i></i><i></i><i></i></span></span>';
}

function pause(ms) {
  return new Promise(resolve => window.setTimeout(resolve, ms));
}

async function typeResponse(bubble, text) {
  const value = String(text || "");
  const step = Math.max(1, Math.ceil(value.length / 260));
  bubble.classList.add("typing-cursor");
  for (let index = step; index < value.length; index += step) {
    bubble.innerHTML = md(value.slice(0, index));
    stream.scrollTop = stream.scrollHeight;
    await pause(16);
  }
  bubble.innerHTML = md(value);
  bubble.classList.remove("typing-cursor");
}

function addBubble(role, html, typing=false) {
  const row = document.createElement("div");
  row.className = role === "user" ? "text-right" : "text-left";

  const bubble = document.createElement("div");
  bubble.className =
    "inline-block rounded-2xl px-4 py-3 max-w-[75%] text-sm " +
    (role === "user"
      ? "bg-[#187ABA] text-white"
      : "bg-white border border-neutral-200");

  bubble.innerHTML = html;
  if (typing) bubble.classList.add("typing-cursor");

  row.appendChild(bubble);
  stream.appendChild(row);
  stream.scrollTop = stream.scrollHeight;

  return bubble;
}

/* INIT */
addBubble("assistant", md("**OrionGPT is live.** Ask a question about the ingested Capital Markets credit agreements and deal materials."));

/* SEND */
async function handleSend() {
  const q = input.value.trim();
  if (!q) return;

  addBubble("user", md(q));
  input.value = "";
  sendBtn.disabled = true;
  sendBtn.textContent = "Thinking…";
  stream.setAttribute("aria-busy", "true");

  const thinking = addBubble("assistant", waitingMarkup());

  try {
    const data = await askOrionBackend(q, 8);
    const answer = data.answer || "No answer returned.";
    const matches = data.matches || [];

    const sources = matches.length
      ? "<br/><br/><em>Sources:</em><br/>" +
        matches.map((m, index) => {
          const pretty = escapeHtml(m.metadata?.company_name || m.metadata?.deal_title || m.metadata?.file_name || m.id);
          const chunk = m.metadata?.chunk_id ? ` — chunk ${m.metadata.chunk_id}` : "";

          const fid = m.metadata?.file_id;
          if (fid) {
            const url = `https://drive.google.com/file/d/${encodeURIComponent(fid)}/view`;
            return `• [Source ${index + 1}] <a href="${url}" target="_blank" rel="noopener" class="text-blue-600 underline">${pretty}</a>${chunk}`;
          }
          return `• [Source ${index + 1}] ${pretty}${chunk}`;
        }).join("<br/>")
      : "";

    await typeResponse(thinking, "**OrionGPT:** " + answer);
    thinking.innerHTML += sources;
    stream.scrollTop = stream.scrollHeight;

  } catch (e) {
    thinking.classList.remove("typing-cursor");
    thinking.innerHTML = md("**Error:** " + e.message);
  } finally {
    sendBtn.disabled = false;
    sendBtn.textContent = "Ask";
    stream.setAttribute("aria-busy", "false");
    input.focus();
  }
}

sendBtn.addEventListener("click", handleSend);
input.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    handleSend();
  }
});
</script>

</body>
</html>
