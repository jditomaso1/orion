<!-- CAPITAL MARKETS ASK ORION — SHARED DRAWER -->
<button
  id="cm-ask-orion-button"
  type="button"
  aria-controls="cm-orion-chat-panel"
  aria-expanded="false"
>
  <span aria-hidden="true">✦</span>
  Ask Orion
</button>

<div id="cm-orion-chat-scrim" aria-hidden="true"></div>

<aside
  id="cm-orion-chat-panel"
  aria-hidden="true"
  aria-label="Ask Orion"
>
  <header class="cm-orion-header">
    <div>
      <div class="cm-orion-kicker">CAPITAL MARKETS RAG</div>
      <div class="cm-orion-title">Ask Orion</div>
      <div class="cm-orion-subtitle">Grounded in the ingested deal stack</div>
    </div>
    <button id="cm-orion-close" type="button" aria-label="Close Ask Orion">✕</button>
  </header>

  <div id="cm-orion-chat-window" aria-live="polite"></div>

  <form id="cm-orion-form">
    <label for="cm-orion-input">Question</label>
    <div class="cm-orion-composer">
      <textarea
        id="cm-orion-input"
        rows="2"
        placeholder="Ask about any ingested Capital Markets deal…"
      ></textarea>
      <button id="cm-orion-send" type="submit">Ask</button>
    </div>
    <p>Answers are limited to authorized Capital Markets source documents.</p>
  </form>
</aside>

<style>
  #cm-ask-orion-button {
    position: fixed;
    top: 14px;
    right: 16px;
    z-index: 9998;
    display: inline-flex;
    align-items: center;
    gap: 7px;
    border: 1px solid rgba(255,255,255,.45);
    border-radius: 999px;
    padding: 8px 13px;
    background: #2563eb;
    color: #fff;
    box-shadow: 0 8px 24px rgba(37,99,235,.24);
    font: 600 12px/1.1 Poppins, ui-sans-serif, system-ui, sans-serif;
    cursor: pointer;
    transition: transform .18s ease, background .18s ease, box-shadow .18s ease;
  }
  #cm-ask-orion-button:hover { background: #1d4ed8; transform: translateY(-1px); box-shadow: 0 10px 28px rgba(37,99,235,.32); }
  #cm-ask-orion-button:focus-visible, #cm-orion-close:focus-visible, #cm-orion-send:focus-visible, #cm-orion-input:focus-visible { outline: 3px solid rgba(37,99,235,.3); outline-offset: 2px; }
  #cm-orion-chat-scrim { position: fixed; inset: 0; z-index: 9998; background: rgba(15,23,42,.26); opacity: 0; pointer-events: none; transition: opacity .25s ease; }
  #cm-orion-chat-scrim.cm-open { opacity: 1; pointer-events: auto; }
  #cm-orion-chat-panel {
    position: fixed;
    inset: 0 0 0 auto;
    z-index: 9999;
    width: min(420px, calc(100vw - 20px));
    display: flex;
    flex-direction: column;
    background: #fff;
    color: #111827;
    box-shadow: -24px 0 60px rgba(15,23,42,.18);
    transform: translateX(105%);
    transition: transform .28s ease;
    font-family: Poppins, ui-sans-serif, system-ui, sans-serif;
  }
  #cm-orion-chat-panel.cm-open { transform: translateX(0); }
  .cm-orion-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 18px; padding: 22px 20px 18px; border-bottom: 1px solid #e5e7eb; }
  .cm-orion-kicker { color: #2563eb; font-size: 9px; font-weight: 700; letter-spacing: .14em; }
  .cm-orion-title { margin-top: 3px; font-size: 20px; font-weight: 700; letter-spacing: -.025em; }
  .cm-orion-subtitle { margin-top: 2px; color: #6b7280; font-size: 11px; }
  #cm-orion-close { border: 0; border-radius: 9px; padding: 7px 9px; background: #f3f4f6; color: #6b7280; cursor: pointer; }
  #cm-orion-chat-window { flex: 1; min-height: 0; overflow-y: auto; padding: 18px; background: #f5f7fb; }
  .cm-orion-row { display: flex; margin-bottom: 12px; }
  .cm-orion-row.cm-user { justify-content: flex-end; }
  .cm-orion-bubble { max-width: 88%; border: 1px solid #e5e7eb; border-radius: 15px 15px 15px 5px; padding: 11px 13px; background: #fff; color: #374151; font-size: 13px; line-height: 1.55; overflow-wrap: anywhere; }
  .cm-orion-user-bubble { border-color: #2563eb; border-radius: 15px 15px 5px 15px; background: #2563eb; color: #fff; }
  .cm-orion-sources { margin-top: 10px; padding-top: 9px; border-top: 1px solid #e5e7eb; color: #6b7280; font-size: 11px; }
  .cm-orion-sources a { color: #2563eb; text-decoration: underline; text-underline-offset: 2px; }
  #cm-orion-form { padding: 14px 16px 16px; border-top: 1px solid #e5e7eb; background: #fff; }
  #cm-orion-form > label { display: block; margin-bottom: 6px; color: #374151; font-size: 11px; font-weight: 600; }
  .cm-orion-composer { display: flex; align-items: flex-end; gap: 8px; border: 1px solid #d1d5db; border-radius: 14px; padding: 8px; background: #fff; }
  #cm-orion-input { flex: 1; min-width: 0; max-height: 130px; resize: vertical; border: 0; padding: 4px; background: transparent; color: #111827; font: 400 13px/1.45 Poppins, ui-sans-serif, system-ui, sans-serif; }
  #cm-orion-input:focus { outline: none; }
  #cm-orion-send { flex: 0 0 auto; border: 0; border-radius: 10px; padding: 9px 13px; background: #111827; color: #fff; font: 600 12px/1 Poppins, ui-sans-serif, system-ui, sans-serif; cursor: pointer; }
  #cm-orion-send:disabled { cursor: wait; opacity: .45; }
  #cm-orion-form > p { margin: 7px 2px 0; color: #9ca3af; font-size: 9px; }
  @media (max-width: 640px) {
    #cm-ask-orion-button { top: auto; right: 12px; bottom: 12px; }
    #cm-orion-chat-panel { width: 100vw; }
  }
</style>

<script>
(() => {
  if (window.__capitalMarketsOrionChatReady) return;
  window.__capitalMarketsOrionChatReady = true;

  const API_BASE = "https://api.private-credit.ai";
  const button = document.getElementById("cm-ask-orion-button");
  const panel = document.getElementById("cm-orion-chat-panel");
  const scrim = document.getElementById("cm-orion-chat-scrim");
  const closeButton = document.getElementById("cm-orion-close");
  const chatWindow = document.getElementById("cm-orion-chat-window");
  const form = document.getElementById("cm-orion-form");
  const input = document.getElementById("cm-orion-input");
  const sendButton = document.getElementById("cm-orion-send");

  function escapeHtml(value) {
    return String(value || "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  function renderText(value) {
    return escapeHtml(value)
      .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
      .replace(/\n/g, "<br>");
  }

  function addMessage(role, value) {
    const row = document.createElement("div");
    row.className = `cm-orion-row ${role === "user" ? "cm-user" : "cm-assistant"}`;
    const bubble = document.createElement("div");
    bubble.className = `cm-orion-bubble ${role === "user" ? "cm-orion-user-bubble" : ""}`;
    bubble.innerHTML = renderText(value);
    row.appendChild(bubble);
    chatWindow.appendChild(row);
    chatWindow.scrollTop = chatWindow.scrollHeight;
    return bubble;
  }

  function renderSources(matches) {
    if (!Array.isArray(matches) || !matches.length) return "";
    const lines = matches.map((match, index) => {
      const metadata = match && match.metadata ? match.metadata : {};
      const label = metadata.company_name || metadata.deal_title || metadata.file_name || match.id || `Source ${index + 1}`;
      const chunk = metadata.chunk_id ? ` · chunk ${escapeHtml(metadata.chunk_id)}` : "";
      if (metadata.file_id) {
        const url = `https://drive.google.com/file/d/${encodeURIComponent(metadata.file_id)}/view`;
        return `<div>[Source ${index + 1}] <a href="${url}" target="_blank" rel="noopener">${escapeHtml(label)}</a>${chunk}</div>`;
      }
      return `<div>[Source ${index + 1}] ${escapeHtml(label)}${chunk}</div>`;
    });
    return `<div class="cm-orion-sources"><strong>Sources</strong>${lines.join("")}</div>`;
  }

  function openPanel() {
    panel.classList.add("cm-open");
    scrim.classList.add("cm-open");
    panel.setAttribute("aria-hidden", "false");
    scrim.setAttribute("aria-hidden", "false");
    button.setAttribute("aria-expanded", "true");
    if (!chatWindow.dataset.greeted) {
      addMessage("assistant", "**OrionGPT is live.** Ask a question about any ingested Capital Markets deal or credit agreement.");
      chatWindow.dataset.greeted = "true";
    }
    window.setTimeout(() => input.focus(), 180);
  }

  function closePanel() {
    panel.classList.remove("cm-open");
    scrim.classList.remove("cm-open");
    panel.setAttribute("aria-hidden", "true");
    scrim.setAttribute("aria-hidden", "true");
    button.setAttribute("aria-expanded", "false");
    button.focus();
  }

  async function askOrion(question) {
    const response = await fetch(`${API_BASE}/capmarkets/ask-orion`, {
      method: "POST",
      credentials: "include",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question, top_k: 8 })
    });
    if (response.status === 401 || response.status === 403) {
      location.replace(`/capmarkets/signin/signin.html?next=${encodeURIComponent(location.pathname)}`);
      throw new Error("Capital Markets access is required.");
    }
    if (!response.ok) {
      let message = `Ask Orion returned ${response.status}`;
      try {
        const payload = await response.json();
        if (typeof payload.detail === "string") message = payload.detail;
      } catch (_) {}
      throw new Error(message);
    }
    return response.json();
  }

  async function submitQuestion(event) {
    event.preventDefault();
    const question = input.value.trim();
    if (!question || sendButton.disabled) return;
    addMessage("user", question);
    input.value = "";
    sendButton.disabled = true;
    const answerBubble = addMessage("assistant", "Checking the Capital Markets deal stack…");
    try {
      const result = await askOrion(question);
      answerBubble.innerHTML = renderText(result.answer || "Orion did not return an answer.") + renderSources(result.matches);
    } catch (error) {
      answerBubble.innerHTML = renderText(`**Error:** ${error.message}`);
    } finally {
      sendButton.disabled = false;
      chatWindow.scrollTop = chatWindow.scrollHeight;
      input.focus();
    }
  }

  button.addEventListener("click", openPanel);
  closeButton.addEventListener("click", closePanel);
  scrim.addEventListener("click", closePanel);
  form.addEventListener("submit", submitQuestion);
  input.addEventListener("keydown", (event) => {
    if (event.key === "Enter" && !event.shiftKey) submitQuestion(event);
  });
  document.addEventListener("keydown", (event) => {
    if (event.key === "Escape" && panel.classList.contains("cm-open")) closePanel();
  });
})();
</script>
