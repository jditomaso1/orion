<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in — Orion</title>

  <link rel="icon" type="image/png"
        href="https://raw.githubusercontent.com/jditomaso1/private-credit-marketing/main/img/favicon.png?v=2" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    body { font-family:'Poppins', sans-serif; background:#f5f6f8; }
    @media (max-width:850px) {
      #sidebar-placeholder { display:none; }
      main { margin-left:0 !important; }
    }
  </style>
</head>

<body class="min-h-screen">
  <div id="sidebar-placeholder"></div>
  <script>
    (async function injectSidebar() {
      try {
        const res = await fetch("/orion/sidebar.html");
        if (!res.ok) return;
        document.getElementById("sidebar-placeholder").innerHTML = await res.text();
        const section = document.getElementById("orion");
        const icon = document.getElementById("icon-orion");
        if (section) section.classList.remove("hidden");
        if (icon) icon.style.transform = "rotate(90deg)";
      } catch (error) {
        console.error("Unable to load Orion navigation", error);
      }
    })();
  </script>

  <main class="ml-64 min-h-screen p-8 flex items-center justify-center">
    <div class="w-full max-w-md bg-white border border-gray-200 rounded-2xl shadow-sm p-6">
      <div class="mb-6">
        <div class="inline-flex items-center rounded-full bg-blue-50 px-3 py-1 text-xs font-semibold text-blue-700">
          ORION WORKSPACE
        </div>
        <h1 class="mt-4 text-2xl font-semibold text-gray-900">Sign in to Orion</h1>
        <p class="text-sm text-gray-600 mt-2">We’ll email you a secure link to enter the Orion workspace.</p>
      </div>

      <label for="email" class="block text-sm font-medium text-gray-700">Email</label>
      <input id="email"
             type="email"
             autocomplete="email"
             placeholder="you@firm.com"
             class="mt-2 w-full rounded-xl border border-gray-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500" />

      <button id="btn"
              class="mt-4 w-full rounded-xl bg-blue-600 text-white py-2.5 font-semibold hover:bg-blue-700 disabled:cursor-wait disabled:bg-blue-400">
        Email me a sign-in link
      </button>

      <div id="msg" class="mt-4 text-sm" role="status" aria-live="polite"></div>

      <div class="mt-6 pt-4 border-t border-gray-100 text-sm text-gray-600">
        <a href="/orion/main.html" class="text-blue-600 font-semibold hover:underline">Return to the Orion dashboard</a>
      </div>
    </div>
  </main>

<script>
  const API_BASE = "https://api.private-credit.ai";
  const MAGIC_ENDPOINT = "/auth/request-link";
  const ORION_HOME = "/orion/main.html";
  const ACCESS_PAGE = "/orion/access.html";

  function requestedNext() {
    const value = new URLSearchParams(window.location.search).get("next");
    return value && value.startsWith("/orion/") && !value.startsWith("//") ? value : ORION_HOME;
  }

  (async function precheck() {
    try {
      const response = await fetch(`${API_BASE}/me`, {
        credentials:"include",
        cache:"no-store"
      });
      if (response.ok) window.location.replace(requestedNext());
      if (response.status === 402) window.location.replace(ACCESS_PAGE);
    } catch (error) {
      // Stay on the page so the visitor can retry while Render wakes up.
    }
  })();

  document.getElementById("btn").addEventListener("click", async () => {
    const email = document.getElementById("email").value.trim();
    const button = document.getElementById("btn");
    const message = document.getElementById("msg");
    message.textContent = "";
    message.className = "mt-4 text-sm";

    if (!email || !email.includes("@")) {
      message.textContent = "Enter a valid email.";
      message.classList.add("text-red-600");
      return;
    }

    try {
      button.disabled = true;
      message.textContent = "Sending link…";
      message.classList.add("text-gray-600");
      const response = await fetch(`${API_BASE}${MAGIC_ENDPOINT}`, {
        method:"POST",
        headers:{ "Content-Type":"application/json" },
        credentials:"include",
        body:JSON.stringify({ email, next:requestedNext() })
      });

      if (response.status === 402) {
        window.location.replace(ACCESS_PAGE);
        return;
      }
      if (!response.ok) {
        const detail = await response.text().catch(() => "");
        throw new Error(detail || `Request failed (${response.status})`);
      }

      message.textContent = "Check your email for the Orion sign-in link.";
      message.classList.remove("text-gray-600");
      message.classList.add("text-green-700");
    } catch (error) {
      message.textContent = "Orion could not send the link. Please try again in a minute.";
      message.classList.remove("text-gray-600");
      message.classList.add("text-red-600");
    } finally {
      button.disabled = false;
    }
  });
</script>
</body>
</html>
