<!-- ASK ORION — BBDC OVERVIEW PROTOTYPE -->
<button id="bbdc-ask-orion" type="button">Ask Orion</button>
<div id="bbdc-orion-scrim"></div>
<aside id="bbdc-orion-panel" aria-hidden="true">
  <header class="oc-head">
    <div><div class="oc-eyebrow">ORION · BBDC INTELLIGENCE</div><div class="oc-title">Ask Orion</div><div id="bbdc-orion-context" class="oc-context">Barings BDC</div></div>
    <button id="bbdc-orion-close" type="button" aria-label="Close Ask Orion">×</button>
  </header>
  <div class="oc-scope"><span></span><span id="bbdc-orion-scope">Focused on BBDC and its portfolio</span></div>
  <div id="bbdc-orion-messages" class="oc-messages"></div>
  <div id="bbdc-orion-prompts" class="oc-prompts">
    <button type="button">Summarize page</button>
    <button type="button">Key metrics</button>
    <button type="button">What matters?</button>
  </div>
  <form id="bbdc-orion-form" class="oc-form">
    <textarea id="bbdc-orion-input" rows="1" placeholder="Ask about BBDC…"></textarea>
    <button type="submit">Ask</button>
  </form>
  <div class="oc-disclaimer">Overview prototype · Answers use data displayed on this page.</div>
</aside>
<style>

r:#172033}.oc-form textarea:focus{border-color:#187aba;box-shadow:0 0 0 3px rgba(24,122,186,.09)}.oc-form button{border:0;border-radius:11px;background:#063b66;color:#fff;padding:10px 14px;font:600 11px Poppins,sans-serif;cursor:pointer}.oc-disclaimer{text-align:center;padding:2px 16px 11px;background:#fff;color:#94a3b8;font-size:8px}@media(max-width:767px){#bbdc-ask-orion{right:14px;top:14px}}
</style>
<style>

<script>
(()=>{const cfg=window.ORION_CHAT_CONFIG||{};const btn=document.getElementById('bbdc-ask-orion'),panel=document.getElementById('bbdc-orion-panel'),close=document.getElementById('bbdc-orion-close'),scrim=document.getElementById('bbdc-orion-scrim'),messages=document.getElementById('bbdc-orion-messages'),form=document.getElementById('bbdc-orion-form'),input=document.getElementById('bbdc-orion-input'),prompts=document.getElementById('bbdc-orion-prompts');const page=(cfg.page||document.querySelector('h1')?.textContent||document.title||'BBDC').trim(),isDaily=/daily brief/i.test(page);document.getElementById('bbdc-orion-context').textContent=page;document.getElementById('bbdc-orion-scope').textContent='Focused on '+page;if(isDaily){prompts.innerHTML='<button type="button">Attention required</button><button type="button">What changed?</button><button type="button">Recommended actions</button>';document.querySelector('.oc-disclaimer').textContent='Daily Brief prototype · Preset answers use the verified briefing package.';}else if(cfg.prompts){prompts.innerHTML=cfg.prompts.map(p=>'<button type="button">'+p+'</button>').join('');document.querySelector('.oc-disclaimer').textContent=cfg.disclaimer||'Focused prototype · Answers use data displayed on this page.';}if(cfg.scope)document.getElementById('bbdc-orion-scope').textContent=cfg.scope;
const open=()=>{panel.classList.add('open');scrim.classList.add('open');panel.setAttribute('aria-hidden','false');setTimeout(()=>input.focus(),280);if(!messages.dataset.ready){typeReply(cfg.intro||`I’m focused on ${page}. Ask me about the information displayed on this page.`);messages.dataset.ready='1'}};const shut=()=>{panel.classList.remove('open');scrim.classList.remove('open');panel.setAttribute('aria-hidden','true')};btn.onclick=open;close.onclick=shut;scrim.onclick=shut;document.addEventListener('keydown',e=>{if(e.key==='Escape')shut()});
function text(id){return document.getElementById(id)?.textContent.trim()||'not available'}function say(role,copy,source=''){const row=document.createElement('div');row.className='oc-row '+role;const bubble=document.createElement('div');bubble.className='oc-bubble';bubble.textContent=copy;if(source){const s=document.createElement('span');s.className='oc-source';s.textContent='Source: '+source;bubble.appendChild(s)}row.appendChild(bubble);messages.appendChild(row);messages.scrollTop=messages.scrollHeight;return bubble}async function typeReply(copy,source=''){const bubble=say('orion','');bubble.classList.add('oc-typing');for(let i=0;i<copy.length;i++){bubble.textContent+=copy[i];messages.scrollTop=messages.scrollHeight;await new Promise(resolve=>setTimeout(resolve,/[,.;:!?]/.test(copy[i])?70:22))}bubble.classList.remove('oc-typing');if(source){const s=document.createElement('span');s.className='oc-source';s.textContent='Source: '+source;bubble.appendChild(s)}messages.scrollTop=messages.scrollHeight}
function visibleMetrics(){return [...document.querySelectorAll('.kpi')].map(el=>{const label=el.querySelector('.kpi-label')?.textContent.trim();const value=el.querySelector('.kpi-value')?.textContent.trim();return label&&value&&value!=='—'?`${label}: ${value}`:null}).filter(Boolean)}
function answer(q){const x=q.toLowerCase();if(cfg.answers){for(const [key,value] of Object.entries(cfg.answers)){if(x.includes(key.toLowerCase()))return value}}if(isDaily){if(/attention|matter|focus|risk/.test(x))return `The main item requiring attention is the widening gap between reported private-credit NAVs and secondary-clearing prices. BBDC trades near 0.76× NAV, within the roughly 75¢ sector band cited by Reuters. Prepare for the July 29–August 6 earnings sequence, follow up on Allvue’s competing deal-data benchmark product, and watch the July 28–29 FOMC. No new BBDC-specific event currently requires escalation.`;if(/changed|new|today|develop/.test(x))return `Three material developments qualified in the current window: private-credit secondary discounts widened to 15–30% with non-traded BDC redemption pressure; Allvue launched OneVue Portfolio Intelligence and Deal Analytics; and GoldenTree closed an oversubscribed $2.75 billion private-credit fund. A regulatory digest was also logged, but its underlying events predated the window.`;if(/action|do|recommend|next/.test(x))return `Recommended actions: 1) pull the Cox Capital SC TO-T tender filings and incorporate the clearing-price evidence into BBDC’s Q2 buyback framing; 2) pre-position portfolio surveillance for ARCC on July 29 and BBDC on August 5–6; 3) obtain Allvue’s benchmark methodology, contributor-consent model and pricing; and 4) update rate sensitivity after the FOMC. No immediate portfolio trade is recommended from this first pass.`;if(/summar|brief|overview/.test(x))return `Today’s briefing identifies a liquidity-confidence gap in private credit, continued strength in primary fundraising, a relevant competitive product launch, and a concentrated Q2 earnings calendar. The immediate posture is monitor and prepare—not escalate.`}const fv=text('fv'),cost=text('cost'),loss=text('unrealized'),companies=text('companies'),instruments=text('instruments'),coupon=text('coupon'),largest=text('largest'),largestPct=text('largest-pct'),metrics=visibleMetrics();if(/fair value|portfolio value|size/.test(x)&&fv!=='not available')return `BBDC reports total portfolio fair value of ${fv}, compared with portfolio cost of ${cost}. The current unrealized gain/(loss) is ${loss}.`;if(/largest|concentration|exposure/.test(x)&&largest!=='not available')return `The largest single company exposure is ${largest}, representing ${largestPct}.`;if(/compan|instrument/.test(x)&&companies!=='not available')return `The portfolio contains ${companies} companies and ${instruments}.`;if(/coupon|yield|income/.test(x)&&coupon!=='not available')return `The weighted average cash coupon on debt is ${coupon}.`;if(metrics.length&&/summar|overview|key metric|focus|this page/.test(x))return `${page} currently highlights: ${metrics.slice(0,6).join('; ')}.`;return `This prototype recognizes the ${page} context and can read its displayed headline metrics. The next layer will search the complete BBDC data and source-document library, reason across pages, and return document-level citations.`}
function ask(q){if(!q.trim())return;say('user',q.trim());input.value='';setTimeout(()=>typeReply(answer(q),isDaily?'July 20 Daily Brief · verified evidence package':(cfg.source||page+' · displayed page data')),180)}form.onsubmit=e=>{e.preventDefault();ask(input.value)};prompts.onclick=e=>{if(e.target.tagName==='BUTTON')ask(e.target.textContent)};
})();
</script>
